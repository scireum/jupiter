[package]
name = "jupiter"
version = "0.0.1"
authors = ["scireum GmbH <info@scireum.de>"]
edition = "2021"
license = "MIT"
description = "Jupiter is a library for providing high-throughput ultra low latency services via the RESP protocol as defined by Redis."
readme = "../README.md"
repository = "https://github.com/scireum/jupiter"
categories = ["caching", "database-implementations", "network-programming"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
bytes = "1.11"
simplelog = "0.12"
anyhow = "1.0"
num-traits = "0.2"
num-derive = "0.5"
yaml-rust = "0.4"
quick-xml = { version = "0.42", features = ["encoding"] }
linked-hash-map = "0.5"
arc-swap = "1.9"
regex = "1.12"
chrono = "0.4"
serde_json = "1.0"
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
hyper-tls = "0.6"
async-trait = "0.1"
fnv = "1.0"
csv = "1.4"
itertools = "0.15"
# Only needed because simplelog's re-exported format_description! macro expands to
# unqualified `time` paths - not used directly anywhere.
time = "0.3"

[dev-dependencies]
mock_instant = "0.6"
# Achtung, die neuste Version (0.29+) schrottet die Tests wegen einem OS error 35
redis = "1.3.0"
